name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: CAVP_API_KEY=ci go run ./cmd/cavp -check -config config.example.yaml
