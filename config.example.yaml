# cache-aware-vllm-proxy configuration.
#
# ${VAR} references are replaced from the environment before parsing, so secrets can live
# outside this file. Unknown keys are an error: a misspelt setting fails at startup instead
# of being ignored. Validate a file with `cavp -check -config config.yaml`.

# Address the proxy listens on (plain HTTP; put TLS in front if it is exposed).
listen: ":4001"

# The vLLM OpenAI-compatible server.
upstream: "http://vllm:8000"

# Who may call the proxy (auth.go). Pick one mode:
#   static    keys listed here, values from the environment
#   external  POST <url>/validate decides (contract in auth.go)
#   none      everyone, as user "anonymous": only for a proxy reachable from
#             trusted hosts alone
# A key's priority is the most urgent its caller can be (lower runs first, as in vLLM);
# a caller may ask to run later with an X-Priority header or a "priority" body field.
auth:
  mode: static
  keys:
    - key: ${CAVP_API_KEY}
      user: default
      priority: 0
  # mode: external
  # url: http://auth-service:4001

# Model names clients may use. "<auto>" resolves to whatever the upstream serves, so
# clients survive a model swap. priority_override makes every request through that alias
# run at that priority or later (it never makes a caller more urgent than its key).
aliases:
  default:
    target: "<auto>"
    description: "Whatever model is currently served."
  batch:
    target: "<auto>"
    priority_override: 10
    description: "Same model, low priority: for non-interactive work that should yield."

# How often to re-read the upstream's model list (for "<auto>" and /v1/models).
models_refresh_interval: "60s"

admission:
  # Most requests the engine runs at once (match vLLM's --max-num-seqs).
  max_active: 8

  cache:
    # Cache-aware admission: admit only what fits the engine's KV pool, keep returning
    # conversations' contexts resident, run mostly-cached work first. Off: max_active only.
    enabled: true

    # vLLM's KV cache event stream (--kv-events-config, ZMQ publisher). The replay socket
    # is expected on the next port. Without it the proxy cannot see what is cached and
    # treats every prompt as cold.
    kv_events_endpoint: "tcp://vllm:5557"

    # Prefill speed of your engine in tokens per second. With decode_interference (how
    # much a running prefill slows decoding, 0-1) it decides how long a finished turn's
    # context is protected: as long as re-prefilling it would take, at least 5 s.
    prefill_tokens_per_s: 4200
    decode_interference: 0.9

    # Output tokens reserved for a request until its conversation has history (then
    # its 75th percentile); output beyond the reserve is charged as it streams.
    default_output_tokens: 2048

    # KV blocks each running request holds beyond its prompt and output (recurrent
    # state, speculative and checkpoint blocks), while prefilling and while decoding.
    # Engine and model specific: measure with `cavp -calibrate` on an idle engine.
    # See "Per-request overhead" in the README; the overcommit guard covers a low figure.
    prefill_overhead_blocks: 4
    decode_overhead_blocks: 4

# Riding out engine restarts. A readiness probe (GET /v1/models, which must list a model)
# runs on its own. When a request fails with a transient error (connection refused or
# reset, or a status in retry_status_codes) and the engine answered a request or a probe
# within recent_success_window, an outage episode opens: that request and every later one
# wait for the probe to answer again and are then retried, all on one shared clock of
# recovery_timeout, after which they fail with 503. An engine that has not answered
# within the window (or one that never answered) fails requests at once until a probe
# succeeds; a 502/503/504 from an engine that never answered also opens one episode,
# for an engine still loading. Set recovery_timeout longer than your engine's restart.
retry:
  retry_status_codes: [502, 503, 504]
  recovery_timeout: "8m"
  recent_success_window: "2m"   # longer than healthy_probe_interval, so one slow probe is harmless
  healthy_probe_interval: "30s" # probe period while the engine answers
  recovery_probe_interval: "3s" # during an outage episode; must be shorter than recovery_timeout
  down_probe_interval: "10s"    # while the engine is down outside an episode

# Memory for request bodies. There is no per-request cap by default (0): instead the
# total held across all requests at once is bounded, each body charged
# body_amplification times its size for the copies parsing makes (default 6). A body
# without a Content-Length is charged, and capped at, max_chunked_body_bytes.
max_body_bytes: 0
max_inflight_body_bytes: 3221225472
max_chunked_body_bytes: 134217728

# Optional per-model sampling defaults. Through an alias they are authoritative and
# replace what the request sent; with the literal model name they only fill in keys the
# request did not set. "thinking" applies when the request enables reasoning,
# "no_thinking" otherwise.
# sampling_defaults:
#   my-model-name:
#     thinking:
#       temperature: 0.6
#       top_p: 0.95
#     no_thinking:
#       temperature: 0.7
#       top_p: 0.8

# Optional reasoning_effort handling per model: translate names the model does not
# accept, and pick one for requests that omit it.
# reasoning_effort_mappings:
#   my-model-name:
#     minimal: low
# reasoning_effort_defaults:
#   my-model-name: medium
