# cache-aware-vllm-proxy configuration.
#
# ${VAR} in a value is replaced from the environment after the file is parsed, so
# secrets can live outside this file and a value never changes the file's structure.
# Unknown keys are an error: a misspelt setting fails at startup instead of being
# ignored. Validate a file with `cavp -check -config config.yaml`.

# Address the proxy listens on (plain HTTP; put TLS in front if it is exposed).
listen: ":4001"

# The vLLM OpenAI-compatible server. It must not require an API key: the proxy sends
# none (the readiness probe and /v1/models would fail).
upstream: "http://vllm:8000"

# Who may call the proxy (internal/auth). Pick one mode:
#   static          keys listed here, values from the environment
#   trusted_header  a gateway in front authenticates callers and sends X-Cavp-User,
#                   X-Cavp-Priority and X-Cavp-Secret (= secret). Make cavp reachable
#                   from the gateway alone, or anyone can claim any identity.
#   none            everyone, as user "anonymous": only for a proxy reachable from
#                   trusted hosts alone
# A caller's priority is the most urgent it can be (lower runs first, as in vLLM); a
# request may ask to run later with a "priority" body field.
auth:
  mode: static
  keys:
    - key: ${CAVP_API_KEY}
      user: default
      priority: 0
  # mode: trusted_header
  # secret: ${CAVP_GATEWAY_SECRET}

admission:
  # Most requests the engine runs at once (match vLLM's --max-num-seqs).
  max_active: 8

  cache:
    # Admission is cache-aware: it admits only what fits the engine's KV pool (read from
    # its /metrics; until then requests wait), keeps returning conversations' contexts
    # resident, and runs mostly-cached work first.

    # vLLM's KV cache event stream (--kv-events-config, ZMQ publisher). Required. The
    # replay socket (replay_endpoint) is expected on the next port: the mirror of the
    # engine's cache is rebuilt from it on every (re)subscribe.
    kv_events_endpoint: "tcp://vllm:5557"

    # Prefill speed of your engine in tokens per second. With decode_interference (how
    # much a running prefill slows decoding, 0-1) it decides how long a finished turn's
    # context is protected: as long as re-prefilling it would take, at least 5 s.
    prefill_tokens_per_s: 4200
    decode_interference: 0.9

    # Output tokens reserved for a request until its conversation has history (then
    # its 75th percentile); output beyond the reserve is charged as it streams.
    default_output_tokens: 2048

    # Output tokens a streamed chunk counts as, when the stream does not report usage per
    # chunk: 1 without speculative decoding, 1 plus the draft length with it (4 for MTP
    # with 3 draft tokens). Over-counting only wastes room; under-counting overcommits.
    tokens_per_chunk: 1

    # KV blocks each running request holds beyond its prompt and output (recurrent
    # state, speculative and checkpoint blocks), while prefilling and while decoding.
    # Engine and model specific: measure with `cavp -calibrate` on an idle engine.
    # See "Per-request overhead" in the README; the overcommit guard covers a low figure.
    # Unset, both are 28, the largest figure measured (hybrid model with speculative
    # decoding): safe but wasteful elsewhere. Set the calibrated values, e.g.:
    # prefill_overhead_blocks: 12
    # decode_overhead_blocks: 10

# The engine is ready while GET /v1/models lists a model, probed every interval. While
# it is not (starting, restarting), requests wait in the queue instead of failing;
# streaming clients get SSE keepalives meanwhile. /readyz reports the probe.
readiness:
  interval: "5s"

# Largest request body accepted; a larger one is answered 413. Image threads are
# tens of megabytes.
max_body_bytes: 268435456
